<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#8ebfcb" />
    <meta http-equiv="Cache-Control" content="no-store" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>泡泡补水</title>
    <link rel="stylesheet" href="./styles.css?v=1.3.1" />
  </head>
  <body>
    <main class="phone-shell" aria-label="泡泡补水游戏">
      <canvas id="game" aria-label="游戏画面"></canvas>

      <section class="hud" aria-label="游戏状态">
        <span id="difficultyLevel" class="difficulty-level">Lv 1</span>
        <div class="score-block water-block life-block">
          <div
            id="heartMeter"
            class="heart-meter"
            role="progressbar"
            aria-label="生命充能"
            aria-valuemin="0"
            aria-valuemax="3"
            aria-valuenow="3"
          >
            <img class="heart-bubble" alt="" />
            <img class="heart-bubble" alt="" />
            <img class="heart-bubble" alt="" />
          </div>
          <div id="comboChip" class="combo-chip" aria-live="polite"></div>
        </div>

        <div class="score-block right">
          <span class="caption">分数</span>
          <strong id="score">0</strong>
          <span id="timeValue" class="time-pill" aria-label="存活时间">0:00</span>
        </div>
      </section>

      <button id="clearSkill" class="clear-skill ready" type="button" aria-label="清屏技能">
        <span>清屏</span>
        <strong id="clearSkillValue">READY</strong>
      </button>

      <button
        id="settingsButton"
        class="settings-button"
        type="button"
        aria-label="打开设置"
        title="设置"
        aria-controls="settingsPanel"
        aria-expanded="false"
      >
        <span aria-hidden="true">&#9881;</span>
      </button>
      <div id="settingsScrim" class="settings-scrim" aria-hidden="true"></div>
      <section
        id="settingsPanel"
        class="settings-panel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="settingsTitle"
        aria-hidden="true"
      >
        <header class="settings-header">
          <div>
            <span id="settingsStatus" class="settings-status">游戏已暂停</span>
            <h2 id="settingsTitle">设置</h2>
          </div>
          <button id="settingsClose" class="settings-close" type="button" aria-label="关闭设置">
            <span aria-hidden="true">&times;</span>
          </button>
        </header>

        <div class="settings-stage">
          <label for="settingsLevel">关卡选择</label>
          <div class="settings-level-control">
            <select id="settingsLevel" aria-label="选择关卡"></select>
            <button id="settingsJump" type="button">进入</button>
          </div>
          <span id="settingsStageMeta" class="settings-stage-meta">Lv 1 · 中央水波</span>
        </div>

        <button id="settingsPause" class="settings-pause" type="button">
          <span id="settingsPauseIcon" aria-hidden="true">&#9654;</span>
          <strong id="settingsPauseLabel">继续游戏</strong>
        </button>
      </section>

      <section id="curtain" class="curtain">
        <div class="title-mark">泡泡补水</div>
        <p class="start-copy">泡泡进入同色背景时戳破它，连续命中为下一颗生命充能。</p>
        <button id="startButton" class="primary-button" type="button">开始</button>
        <div id="endStats" class="end-stats"></div>
      </section>
      <div id="startTransition" class="start-transition" aria-hidden="true"></div>
    </main>

    <script src="./background-engine.js?v=1.3.1" defer></script>
    <script src="./game.js?v=1.3.1" defer></script>
  </body>
</html>
